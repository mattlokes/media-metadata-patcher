[project]
name = "media-metadata-filler"
version = "0.1.0"
description = "Home Assistant integration that fills missing now-playing metadata on any media player"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14.2"

# Development only: the integration itself ships as custom_components/media_metadata_filler.
[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component==0.13.367",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
