# Copy to config.toml and edit. Relative paths are resolved against this file.

[mqtt]
host = "homeassistant.local"
port = 1883
username = "hass_sonos_metadata_mux"
password_file = "mqtt_password"     # or: password = "..."
discovery_prefix = "homeassistant"
base_topic = "hass_sonos_metadata_mux"

[sonos]
# Port SoCo listens on for UPnP events. The speakers must be able to reach it.
event_listener_port = 1400
# advertise_ip = "192.168.1.50"     # set if this machine has several interfaces

[bbc]
poll_interval = 20                  # seconds between BBC now-playing checks
image_size = "640x640"              # artwork size requested from the BBC image service

[[player]]
id = "kitchen"                      # lowercase letters, digits, _
name = "Kitchen (muxed)"
sonos_host = "192.168.1.60"         # or: sonos_name = "Kitchen"
